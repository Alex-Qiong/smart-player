name: Build Windows 安装包

# 推送代码或手动触发时，在微软的 Windows 云主机上自动打包安装版 exe
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller py7zr requests

      - name: 下载 libmpv-2.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_libmpv.py

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm player.spec

      - name: 下载 TTS 中文语音（打包进安装程序）
        run: |
          mkdir installer\assets\tts
          curl -sL -o installer\assets\tts\zh_CN-huayan-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx"
          curl -sL -o installer\assets\tts\zh_CN-huayan-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx.json"

      - name: Inno Setup 生成安装包
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\smartplayer.iss

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SmartPlayer-installer
          path: installer-out/SmartPlayer-Setup-*.exe
          if-no-files-found: error
